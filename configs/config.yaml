# Hydra config for train.py (replaces configurator.py).
#
# The model/ and data/ group files use "# @package _global_" so their keys are
# merged at the top level, matching the flat variable names train.py expects
# (train.py does globals().update(cfg)). Override from the CLI hydra-style, e.g.
#   torchrun ... train.py model=ngpt data=tinystories out_dir=... max_iters=10000
defaults:
  - _self_
  - model: regular          # tiny | small | medium | large | regular, define the number of layers, heads, embedding size
  - data: openwebtext    # openwebtext | tinystories  (sets dataset, data_dir)
  - optimizer: gpt_opt.yaml

# --- I/O -------------------------------------------------------------------
data_dir = '' # absolute path to the dir holding train.bin/val.bin; '' = legacy auto-detect relative to cwd
out_dir: ./out                 # run dir: checkpoints/, eval/, .hydra/, stat, args, finished
init_from: scratch             # scratch | resume
eval_interval: 1000
eval_iters: 200
log_interval: 10
eval_only: false
always_save_checkpoint: true

# --- run shape -------------------------------------------------------------
batch_size: 8                  # micro-batch per GPU
gradient_accumulation_steps: 64  # GLOBAL value; train.py divides it by world size
max_iters: 600000
lr_decay_iters: 600000
decay_lr: true
time_limit_seconds: 1000000000
max_iters_per_launch: 1000000000

# --- model dims (model TYPE is set by the model/ group) --------------------
use_nGPT: 0
# n_layer: 12
# n_head: 16
# n_embd: 1024
# block_size: 1024
# dropout: 0.0
# bias: false
# weight_dtype: bfloat16         # bfloat16 | float32 (storage of matrix weights)

# --- optimizer -------------------------------------------------------------
# learning_rate: 15e-4
# min_lr: 0.0
# beta1: 0.9
# beta2: 0.95
# grad_clip: 1.0
# weight_decay: 0.1
# warmup_iters: 2000

# --- system ----------------------------------------------------------------
device: cuda
dtype: bfloat16                # autocast compute dtype: float32 | bfloat16 | float16
backend: nccl
compile: false

# --- wandb -----------------------------------------------------------------
wandb_log: false
wandb_project: owt
wandb_run_name: gpt2
